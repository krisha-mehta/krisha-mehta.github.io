<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — Krisha Mehta{% else %}Krisha Mehta{% endif %}</title>
    <meta name="author" content="Krisha Mehta">
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}Krisha Mehta{% endif %}"/>
    <meta property="og:url" content="{{ site.url }}{{ page.url }}"/>
    <meta property="og:image" content="{{ site.url }}/img/profile1.jpg"/>
    <meta property="og:site_name" content="Krisha Mehta"/>
    <meta name="twitter:card" content="summary"/>
    <meta name="twitter:creator" content="@KrishaMehta2"/>
    <meta name="twitter:site" content="@KrishaMehta2"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="apple-touch-icon" sizes="180x180" href="/ico/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/ico/favicon-32x32.png">
    <link rel="shortcut icon" href="/ico/favicon-96x96.png">

    <link rel="stylesheet" href="/css/researcher.css">
</head>
<body>
    <div class="site-wrapper">

        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-inner">

                <div class="profile-section">
                    <img src="/img/profile1.jpg" alt="Krisha Mehta" class="profile-photo">
                    <h1 class="sidebar-name">Krisha Mehta</h1>
                    <p class="sidebar-pronouns">she/her</p>
                    <p class="sidebar-affiliation">
                        PhD Student<br>
                        Department of Computer Science<br>
                        University of Chicago
                    </p>
                    <p class="sidebar-email">
                        <a href="mailto:krisha@uchicago.edu">krisha@uchicago.edu</a>
                    </p>
                </div>

                <div class="sidebar-links">
                    <a href="https://drive.google.com/file/d/1JpgylJbeIjaUEZy4sWsH2YXw_eqT8VfY/view" target="_blank" class="sidebar-link">
                        <i class="fas fa-file-alt"></i> CV
                    </a>
                    <a href="https://scholar.google.com/citations?user=T2PjY2EAAAAJ" target="_blank" class="sidebar-link">
                        <i class="fas fa-graduation-cap"></i> Google Scholar
                    </a>
                    <a href="https://twitter.com/KrishaMehta2" target="_blank" class="sidebar-link">
                        <i class="fa-brands fa-x-twitter"></i> Twitter / X
                    </a>
                    <a href="https://www.linkedin.com/in/krishamehta" target="_blank" class="sidebar-link">
                        <i class="fa-brands fa-linkedin-in"></i> LinkedIn
                    </a>
                </div>

                <nav class="sidebar-nav">
                    <a href="/#about" class="nav-link" data-section="about">About</a>
                    <a href="/#news" class="nav-link" data-section="news">What's New</a>
                    <a href="/#publications" class="nav-link" data-section="publications">Publications</a>
                    <a href="/reading-list/" class="nav-link{% if page.url contains 'reading-list' %} active{% endif %}">Reading List</a>
                    <a href="/photos/" class="nav-link{% if page.url contains 'photos' %} active{% endif %}">Photos</a>
                </nav>

            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {{ content }}
        </main>

    </div>

    <script>
        // Smooth scroll for anchor links when already on home page
        document.querySelectorAll('a[href^="/#"]').forEach(link => {
            link.addEventListener('click', function(e) {
                if (window.location.pathname === '/') {
                    e.preventDefault();
                    const id = this.getAttribute('href').replace('/#', '');
                    const el = document.getElementById(id);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // Highlight active section in sidebar while scrolling
        if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
            const navLinks = document.querySelectorAll('.nav-link[data-section]');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        navLinks.forEach(l => l.classList.remove('active'));
                        const active = document.querySelector(`.nav-link[data-section="${entry.target.id}"]`);
                        if (active) active.classList.add('active');
                    }
                });
            }, { rootMargin: '-20% 0px -70% 0px' });

            ['about', 'news', 'publications'].forEach(id => {
                const el = document.getElementById(id);
                if (el) observer.observe(el);
            });
        }
    </script>
</body>
</html>
